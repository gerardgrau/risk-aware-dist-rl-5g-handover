# Model: Contextual Multi-Armed Bandit (CMAB Baseline)
# Publication: IEEE TMLCN 2026 (Reproduced from Moreno-Locubiche et al. 2024)
# Framework: Online Linear Upper Confidence Bound (LinUCB)

system:
  tx_power: 25
  noise_level: -101
  receiver_sensitivity: -95

simulation:
  total_sim_time: 300
  time_step: 0.01
  ue_number: 1000
  bs_number: 7
  event_driven: false
  learned_trigger: false

agent:
  type: cmab
  alpha: 0.5
  gamma: 0.99
  feature_dim: 88

benchmark:
  num_seeds: 1
  results_dir: results/benchmarks
  env_type: ltm

ho_reward:
  alpha_hof: 0.1
  alpha_ho: 0.8
  alpha_pp: 0.9

ho_state:
  moving_average_window: 50

ho_prep:
  periodicity_rsrp_measurement: 0.02
  average_rsrp_measurement_nl1: 10
  kl3: 8
  preparation_power_offset: -3
  preparation_time: 0.04
  exec_power_offset: 3.0
  max_number_prepared_bs: 5

paths:
  channel_data_directory: data/ChannelGains
  precomputed_data_directory: data/Precomputed
  dataset_subdir: no_ris
